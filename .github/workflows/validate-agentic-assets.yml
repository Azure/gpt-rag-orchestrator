name: Validate Copilot engineering assets

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"

permissions:
  contents: read

jobs:
  validate:
    name: frontmatter and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install pinned validator dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r .github/scripts/requirements.txt

      - name: Validate agents, skills, and scoped instructions
        run: python .github/scripts/validate-agentic-assets.py
