name: Pull Request Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run unit tests
        run: pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 20 mirrors the `javascript-node:20-bookworm` base image used by the
      # frontend build stage in the root Dockerfile, so a green run here means
      # the image builds too.
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # `npm install` (not `npm ci`) matches the Dockerfile, so an unpublished
      # or peer-incompatible version is caught here rather than at deploy time.
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: frontend
        run: npm run build