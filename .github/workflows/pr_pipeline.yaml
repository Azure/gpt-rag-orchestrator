name: Pull Request Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run unit tests
        run: pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 20 mirrors the `javascript-node:20-bookworm` base image used by the
      # frontend build stage in the root Dockerfile, so a green run here means
      # the image builds too.
      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # `npm install` (not `npm ci`) matches the Dockerfile, so an unpublished
      # or peer-incompatible version is caught here rather than at deploy time.
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: frontend
        run: npm run build